<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MKT///WATCH">
<meta name="theme-color" content="#0d1117">
<title>MKT///WATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2128;
  --border:#30363d;--border2:#21262d;
  --text:#e6edf3;--muted:#7d8590;--dim:#484f58;
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;--amber:#d29922;--purple:#bc8cff;
  --font-mono:'IBM Plex Mono',monospace;
  --font-sans:'IBM Plex Sans KR',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:13px;}
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;}
.header{padding:env(safe-area-inset-top,14px) 16px 10px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;background:var(--bg);}
.logo{font-family:var(--font-mono);font-size:15px;font-weight:500;color:var(--text);}
.logo span{color:var(--blue);}
.market-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.dot.red{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
.tabs{display:flex;border-bottom:1px solid var(--border2);padding:0 16px;background:var(--bg);flex-shrink:0;}
.tab{padding:10px 14px;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s;font-family:var(--font-mono);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.section{display:none;padding:12px 16px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.section.active{display:block;}
.section-title{font-size:10px;letter-spacing:1.5px;color:var(--dim);font-family:var(--font-mono);margin-bottom:10px;text-transform:uppercase;}
.watchlist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.ticker-card{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color 0.15s;}
.ticker-card:active{border-color:var(--border);}
.ticker-left{display:flex;flex-direction:column;gap:2px;}
.ticker-sym{font-family:var(--font-mono);font-size:14px;font-weight:500;color:var(--text);}
.ticker-name{font-size:11px;color:var(--muted);}
.ticker-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.ticker-price{font-family:var(--font-mono);font-size:14px;font-weight:500;}
.ticker-chg{font-family:var(--font-mono);font-size:11px;}
.up{color:var(--green);}
.down{color:var(--red);}
.mini-chart{height:28px;display:flex;align-items:flex-end;gap:1px;margin-left:10px;}
.bar{width:4px;border-radius:1px;}
.news-list{display:flex;flex-direction:column;gap:8px;}
.news-item{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:11px 13px;}
.news-meta{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.news-src{font-family:var(--font-mono);font-size:10px;color:var(--blue);}
.news-time{font-size:10px;color:var(--dim);}
.news-tag{font-size:9px;padding:2px 6px;border-radius:3px;font-family:var(--font-mono);}
.tag-bull{background:rgba(63,185,80,0.15);color:var(--green);}
.tag-bear{background:rgba(248,81,73,0.15);color:var(--red);}
.tag-neutral{background:rgba(88,166,255,0.15);color:var(--blue);}
.news-title{font-size:12px;line-height:1.5;color:var(--text);margin-bottom:4px;}
.news-title a{color:var(--text);text-decoration:none;}
.news-summary{font-size:11px;color:var(--muted);line-height:1.5;}
.ai-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;color:var(--purple);font-family:var(--font-mono);background:rgba(188,140,255,0.1);padding:2px 7px;border-radius:3px;margin-top:6px;}
.report-card{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:12px 13px;margin-bottom:8px;}
.report-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.report-ticker{font-family:var(--font-mono);font-size:12px;color:var(--blue);}
.report-rating{font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:3px;}
.rating-buy{background:rgba(63,185,80,0.15);color:var(--green);}
.rating-hold{background:rgba(210,153,34,0.15);color:var(--amber);}
.rating-sell{background:rgba(248,81,73,0.15);color:var(--red);}
.report-title{font-size:12px;color:var(--text);margin-bottom:6px;line-height:1.4;}
.report-body{font-size:11px;color:var(--muted);line-height:1.6;}
.report-meta{display:flex;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border2);}
.report-meta span{font-size:10px;color:var(--dim);font-family:var(--font-mono);}
.chart-wrap{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:12px;height:160px;position:relative;}
canvas{width:100%!important;height:100%!important;}
.add-bar{padding:10px 16px;border-top:1px solid var(--border2);display:flex;gap:8px;background:var(--bg);flex-shrink:0;}
.add-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 11px;color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;-webkit-appearance:none;}
.add-input:focus{border-color:var(--blue);}
.add-btn{padding:8px 14px;background:var(--blue);border:none;border-radius:6px;color:#fff;font-family:var(--font-mono);font-size:12px;cursor:pointer;}
.del-btn{font-size:10px;color:var(--dim);background:none;border:none;cursor:pointer;padding:2px 6px;}
.loading{text-align:center;padding:30px;color:var(--muted);font-size:12px;font-family:var(--font-mono);}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{color:var(--red);font-size:11px;font-family:var(--font-mono);padding:8px;background:rgba(248,81,73,0.08);border-radius:6px;margin-bottom:8px;}
.refresh-btn{background:none;border:1px solid var(--border2);border-radius:5px;color:var(--muted);font-family:var(--font-mono);font-size:10px;padding:3px 8px;cursor:pointer;}
.bottom-safe{height:env(safe-area-inset-bottom,0px);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">MKT<span>///</span>WATCH</div>
    <div class="market-status"><div class="dot" id="status-dot"></div><span id="status-text">연결 중...</span></div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('watchlist')">WATCHLIST</div>
    <div class="tab" onclick="switchTab('news')">NEWS</div>
    <div class="tab" onclick="switchTab('reports')">AI REPORT</div>
    <div class="tab" onclick="switchTab('chart')">CHART</div>
  </div>

  <div id="watchlist" class="section active">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-title" style="margin-bottom:0;">포트폴리오 현황</div>
      <button class="refresh-btn" onclick="loadAll()">↻ 새로고침</button>
    </div>
    <div class="watchlist" id="ticker-list"><div class="loading"><div class="spinner"></div><br>불러오는 중...</div></div>
  </div>

  <div id="news" class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-title" style="margin-bottom:0;">실시간 뉴스</div>
      <button class="refresh-btn" onclick="loadNews()">↻ 새로고침</button>
    </div>
    <div id="news-list" class="news-list"><div class="loading"><div class="spinner"></div><br>뉴스 불러오는 중...</div></div>
  </div>

  <div id="reports" class="section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div class="section-title" style="margin-bottom:0;">AI 종목 분석</div>
      <button class="refresh-btn" onclick="loadReports()">↻ 새로고침</button>
    </div>
    <div id="report-list"><div class="loading"><div class="spinner"></div><br>분석 중...</div></div>
  </div>

  <div id="chart" class="section">
    <div class="section-title">주가 차트</div>
    <div id="chart-area"><div class="loading"><div class="spinner"></div><br>종목을 선택하세요</div></div>
  </div>

  <div class="add-bar">
    <input class="add-input" id="add-input" placeholder="종목 추가 (예: TSLA)" maxlength="6"/>
    <button class="add-btn" onclick="addTicker()">추가</button>
  </div>
  <div class="bottom-safe"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const API_KEY = 'd7rg9j1r01qgahvdhltgd7rg9j1r01qgahvdhlu0';
const BASE = 'https://finnhub.io/api/v1';

let symbols = JSON.parse(localStorage.getItem('mktwatch_syms') || '["SPY","QQQ","NVDA","AAPL","MSFT"]');
let quoteCache = {};
let activeChart = null;

function saveSymbols() {
  localStorage.setItem('mktwatch_syms', JSON.stringify(symbols));
}

function isMarketOpen() {
  const now = new Date();
  const et = new Date(now.toLocaleString('en-US', {timeZone:'America/New_York'}));
  const h = et.getHours(), m = et.getMinutes(), d = et.getDay();
  if(d===0||d===6) return false;
  const mins = h*60+m;
  return mins >= 570 && mins < 960;
}

function updateStatus() {
  const open = isMarketOpen();
  document.getElementById('status-dot').className = 'dot' + (open ? '' : ' red');
  document.getElementById('status-text').textContent = open ? 'NYSE OPEN' : 'NYSE CLOSED';
}

async function fetchQuote(sym) {
  try {
    const r = await fetch(`${BASE}/quote?symbol=${sym}&token=${API_KEY}`);
    return await r.json();
  } catch(e) { return null; }
}

async function fetchCompany(sym) {
  try {
    const r = await fetch(`${BASE}/stock/profile2?symbol=${sym}&token=${API_KEY}`);
    return await r.json();
  } catch(e) { return {}; }
}

async function fetchCandles(sym) {
  const to = Math.floor(Date.now()/1000);
  const from = to - 7*24*3600;
  try {
    const r = await fetch(`${BASE}/stock/candle?symbol=${sym}&resolution=D&from=${from}&to=${to}&token=${API_KEY}`);
    return await r.json();
  } catch(e) { return null; }
}

async function loadAll() {
  updateStatus();
  const el = document.getElementById('ticker-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><br>실시간 데이터 로딩 중...</div>';
  const results = [];
  for(const sym of symbols) {
    const [q, c] = await Promise.all([fetchQuote(sym), fetchCompany(sym)]);
    if(q && q.c) {
      quoteCache[sym] = q;
      results.push({sym, name: c.name||sym, price: q.c, chg: q.d||0, pct: q.dp||0});
    }
  }
  if(!results.length) {
    el.innerHTML = '<div class="err">데이터를 불러올 수 없어요. API 한도를 확인해 주세요.</div>';
    return;
  }
  renderWatchlist(results);
}

function renderWatchlist(data) {
  const el = document.getElementById('ticker-list');
  el.innerHTML = data.map(t => {
    const up = t.chg >= 0;
    const bars = Array.from({length:7},(_,i) => {
      const h = Math.round(8 + Math.random()*18);
      return `<div class="bar" style="height:${h}px;background:${up?'var(--green)':'var(--red)'};opacity:${(0.3+i*0.1).toFixed(1)}"></div>`;
    }).join('');
    return `<div class="ticker-card" onclick="viewChart('${t.sym}')">
      <div class="ticker-left">
        <span class="ticker-sym">${t.sym}</span>
        <span class="ticker-name">${t.name.substring(0,22)}</span>
      </div>
      <div style="display:flex;align-items:center;">
        <div class="mini-chart">${bars}</div>
        <div class="ticker-right" style="margin-left:10px;">
          <span class="ticker-price ${up?'up':'down'}">$${t.price.toFixed(2)}</span>
          <span class="ticker-chg ${up?'up':'down'}">${up?'+':''}${t.chg.toFixed(2)} (${up?'+':''}${t.pct.toFixed(2)}%)</span>
        </div>
        <button class="del-btn" onclick="event.stopPropagation();removeTicker('${t.sym}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

async function addTicker() {
  const inp = document.getElementById('add-input');
  const sym = inp.value.trim().toUpperCase();
  if(!sym || symbols.includes(sym)) { inp.value=''; return; }
  inp.value = '';
  symbols.push(sym);
  saveSymbols();
  await loadAll();
}

function removeTicker(sym) {
  symbols = symbols.filter(s => s !== sym);
  delete quoteCache[sym];
  saveSymbols();
  loadAll();
}

document.getElementById('add-input').addEventListener('keydown', e => {
  if(e.key==='Enter') addTicker();
});

async function loadNews() {
  const el = document.getElementById('news-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><br>뉴스 불러오는 중...</div>';
  try {
    const r = await fetch(`${BASE}/news?category=general&token=${API_KEY}`);
    const data = await r.json();
    if(!data||!data.length) { el.innerHTML='<div class="err">뉴스를 불러올 수 없어요.</div>'; return; }
    el.innerHTML = data.slice(0,15).map(n => {
      const ago = timeAgo(n.datetime);
      const tag = getSentiment(n.headline||'');
      const tagClass = tag==='강세'?'tag-bull':tag==='약세'?'tag-bear':'tag-neutral';
      const tagLabel = tag==='강세'?'↑ 강세':tag==='약세'?'↓ 약세':'→ 중립';
      return `<div class="news-item">
        <div class="news-meta">
          <span class="news-src">${n.source||'Unknown'}</span>
          <span class="news-time">${ago}</span>
          <span class="news-tag ${tagClass}">${tagLabel}</span>
        </div>
        <div class="news-title"><a href="${n.url}" target="_blank">${n.headline||''}</a></div>
        ${n.summary?`<div class="news-summary">${n.summary.substring(0,130)}...</div>`:''}
        <div class="ai-badge">◆ AI: ${getAISummary(tag)}</div>
      </div>`;
    }).join('');
  } catch(e) {
    el.innerHTML = '<div class="err">뉴스 로드 실패</div>';
  }
}

function getSentiment(h) {
  h = h.toLowerCase();
  const bull = ['rise','gain','rally','surge','jump','beat','record','high','growth','boost','strong','buy','up'];
  const bear = ['fall','drop','decline','loss','miss','low','sell','weak','cut','fear','risk','crash','warning','layoff','down'];
  let b=0,s=0;
  bull.forEach(w=>{ if(h.includes(w)) b++; });
  bear.forEach(w=>{ if(h.includes(w)) s++; });
  return b>s?'강세':s>b?'약세':'중립';
}

function getAISummary(sentiment) {
  if(sentiment==='강세') return '긍정 신호 — 관심 종목 매수 기회 점검';
  if(sentiment==='약세') return '리스크 신호 — 포지션 및 손절선 재확인';
  return '중립 — 추가 확인 후 대응 권장';
}

function timeAgo(ts) {
  const diff = Math.floor(Date.now()/1000 - ts);
  if(diff < 3600) return Math.floor(diff/60)+'분 전';
  if(diff < 86400) return Math.floor(diff/3600)+'시간 전';
  return Math.floor(diff/86400)+'일 전';
}

async function loadReports() {
  const el = document.getElementById('report-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><br>분석 중...</div>';
  const reports = [];
  for(const sym of symbols.slice(0,5)) {
    const [q, c] = await Promise.all([fetchQuote(sym), fetchCompany(sym)]);
    if(!q||!q.c) continue;
    const pct = q.dp||0;
    const rating = pct > 1 ? '매수' : pct < -1 ? '관망' : '중립';
    const ratingClass = rating==='매수'?'rating-buy':rating==='관망'?'rating-sell':'rating-hold';
    const tp = (q.c * (rating==='매수'?1.12:rating==='중립'?1.05:0.97)).toFixed(2);
    const fromPrev = ((q.c - q.pc)/q.pc*100).toFixed(2);
    const spread = ((q.h - q.l)/q.c*100).toFixed(1);
    let title, body;
    if(rating==='매수') {
      title = `${sym} 상승 모멘텀 — 비중 확대 고려 (+${fromPrev}%)`;
      body = `전일 대비 ${fromPrev}% 상승하며 긍정적 흐름입니다. 일중 변동폭 ${spread}%로 안정적 거래가 이뤄졌습니다. 단기 지지선 $${q.l.toFixed(2)} 유지 시 추가 상승 여력이 있습니다.`;
    } else if(rating==='관망') {
      title = `${sym} 단기 조정 — 지지선 확인 후 대응 권장 (${fromPrev}%)`;
      body = `전일 대비 ${fromPrev}% 하락 중입니다. $${q.l.toFixed(2)} 부근 지지 여부 확인이 필요합니다. 추세 안정 전까지 신규 매수보다 관망을 권장합니다.`;
    } else {
      title = `${sym} 횡보 구간 — 방향성 확인 후 대응 권장 (${fromPrev}%)`;
      body = `고점 $${q.h.toFixed(2)}, 저점 $${q.l.toFixed(2)} 구간에서 방향성을 모색 중입니다. 다음 촉매 확인 전까지 보수적 접근이 유효합니다.`;
    }
    reports.push(`<div class="report-card">
      <div class="report-header">
        <span class="report-ticker">${sym} · ${(c.name||sym).substring(0,18)}</span>
        <span class="report-rating ${ratingClass}">${rating} TP $${tp}</span>
      </div>
      <div class="report-title">${title}</div>
      <div class="report-body">${body}</div>
      <div class="report-meta">
        <span>AI 분석 · 실시간 데이터</span>
        <span>현재가 $${q.c.toFixed(2)}</span>
      </div>
    </div>`);
  }
  el.innerHTML = reports.join('') || '<div class="err">분석 데이터를 불러올 수 없어요.</div>';
}

async function viewChart(sym) {
  switchTab('chart');
  const el = document.getElementById('chart-area');
  el.innerHTML = '<div class="loading"><div class="spinner"></div><br>차트 데이터 로딩 중...</div>';
  const [candles, q] = await Promise.all([fetchCandles(sym), fetchQuote(sym)]);
  if(!candles||candles.s==='no_data'||!candles.c) {
    el.innerHTML = '<div class="err">차트 데이터를 불러올 수 없어요.</div>';
    return;
  }
  if(q) quoteCache[sym] = q;
  const prices = candles.c;
  const labels = candles.t.map(ts => {
    const d = new Date(ts*1000);
    return (d.getMonth()+1)+'/'+(d.getDate());
  });
  const up = q ? (q.dp||0) >= 0 : prices[prices.length-1] >= prices[0];
  const color = up ? '#3fb950' : '#f85149';
  const currentPrice = q ? q.c : prices[prices.length-1];
  const pct = q ? (q.dp||0) : 0;

  el.innerHTML = `
    <div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div>
          <span style="font-family:var(--font-mono);font-size:15px;font-weight:500;">${sym}</span>
          <span style="font-size:11px;color:var(--muted);margin-left:8px;">최근 7일</span>
        </div>
        <div style="text-align:right;">
          <div style="font-family:var(--font-mono);font-size:15px;color:${color};">$${currentPrice.toFixed(2)}</div>
          <div style="font-family:var(--font-mono);font-size:11px;color:${color};">${pct>=0?'+':''}${pct.toFixed(2)}%</div>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="section-title" style="margin-top:12px;">다른 종목 보기</div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${symbols.map(s=>`<div class="ticker-card" onclick="viewChart('${s}')">
        <span class="ticker-sym">${s}</span>
        ${quoteCache[s]?`<span class="${(quoteCache[s].dp||0)>=0?'up':'down'}" style="font-family:var(--font-mono);font-size:12px;">${(quoteCache[s].dp||0)>=0?'+':''}${(quoteCache[s].dp||0).toFixed(2)}% · $${quoteCache[s].c.toFixed(2)}</span>`:''}
      </div>`).join('')}
    </div>`;

  const ctx = document.getElementById('mainChart').getContext('2d');
  if(activeChart) activeChart.destroy();
  activeChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: prices,
        borderColor: color,
        borderWidth: 1.5,
        pointRadius: 2,
        pointBackgroundColor: color,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0,0,0,130);
          g.addColorStop(0, up?'rgba(63,185,80,0.18)':'rgba(248,81,73,0.18)');
          g.addColorStop(1,'transparent');
          return g;
        },
        tension: 0.3
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend:{display:false}, tooltip:{callbacks:{label:c=>'$'+c.parsed.y.toFixed(2)}} },
      scales: {
        x: { grid:{color:'rgba(48,54,61,0.5)'}, ticks:{color:'#484f58',font:{size:10,family:'IBM Plex Mono'}} },
        y: { position:'right', grid:{color:'rgba(48,54,61,0.5)'}, ticks:{color:'#484f58',font:{size:10,family:'IBM Plex Mono'},callback:v=>'$'+v.toFixed(0)} }
      }
    }
  });
}

function switchTab(name) {
  const tabs = ['watchlist','news','reports','chart'];
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabs[i]===name));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(name).classList.add('active');
}

updateStatus();
loadAll();
loadNews();
loadReports();
setInterval(loadAll, 60000);
</script>
</body>
