<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>MKT WATCH // PRO</title>
    <style>
        :root { --bg: #050505; --card: #111; --border: #222; --text: #eee; --muted: #888; --accent: #58a6ff; --up: #00ff88; --down: #ff4444; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 0 auto; padding: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .sym { font-weight: bold; font-size: 1.1rem; }
        .price { font-weight: bold; font-size: 1.1rem; }
        .change { font-size: 0.8rem; text-align: right; }
        .section-title { font-size: 0.9rem; font-weight: bold; color: var(--accent); margin: 25px 0 10px; text-transform: uppercase; border-left: 3px solid var(--accent); padding-left: 10px; }
        .news-item { margin-bottom: 15px; font-size: 0.9rem; line-height: 1.4; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        a { color: inherit; text-decoration: none; }
        .ai-box { background: rgba(88, 166, 255, 0.05); border: 1px dashed var(--accent); padding: 12px; border-radius: 8px; font-size: 0.85rem; color: #ccc; }
        input { width: 70%; background: #1a1a1a; border: 1px solid var(--border); padding: 10px; color: #fff; border-radius: 5px; }
        button { width: 25%; background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-weight:900; font-size:1.3rem;">MKT WATCH</div>
            <div id="m-status" style="font-size:0.75rem; color:var(--muted);">연결 중...</div>
        </div>

        <div class="section-title">실시간 시세</div>
        <div id="price-list">로딩 중...</div>

        <div class="section-title">실시간 뉴스</div>
        <div id="news-list">뉴스를 불러오는 중...</div>

        <div class="section-title">AI 종목 분석</div>
        <div id="ai-list">분석 데이터를 생성 중입니다...</div>

        <div style="margin-top:30px; display:flex; justify-content:space-between;">
            <input type="text" id="t-in" placeholder="티커 입력">
            <button onclick="addT()">추가</button>
        </div>
    </div>

    <script>
        const KEY = 'd7rg9j1r01qgahvdhltgd7rg9j1r01qgahvdhlu0';[cite: 1]
        let syms = JSON.parse(localStorage.getItem('my_s_v3') || '["QQQ","SPY","NVDA","AAPL"]');[cite: 1]

        async function init() {
            // 시장 상태 확인
            const et = new Date(new Date().toLocaleString('en-US', {timeZone:'America/New_York'}));
            const isOpen = et.getDay() >= 1 && et.getDay() <= 5 && (et.getHours() > 9 || (et.getHours() === 9 && et.getMinutes() >= 30)) && et.getHours() < 16;
            document.getElementById('m-status').innerText = isOpen ? '● 미 증시 개장' : '○ 미 증시 휴장';

            // 시세 로드
            const pList = document.getElementById('price-list');
            let pHtml = '';
            for(const s of syms) {
                try {
                    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${KEY}`);[cite: 1]
                    const d = await r.json();
                    const isUp = d.dp >= 0;
                    const color = isUp ? 'var(--up)' : 'var(--down)';
                    pHtml += `<div class="card"><div class="row"><div><div class="sym">${s}</div><div style="font-size:0.7rem;color:var(--muted)">US Market</div></div><div style="text-align:right;"><div class="price" style="color:${color}">$${d.c.toFixed(2)}</div><div class="change" style="color:${color}">${isUp?'+':''}${d.dp.toFixed(2)}%</div></div></div></div>`;
                } catch(e) {}
            }
            pList.innerHTML = pHtml;

            // 뉴스 로드
            const nList = document.getElementById('news-list');
            try {
                const nr = await fetch(`https://finnhub.io/api/v1/news?category=general&token=${KEY}`);[cite: 1]
                const nd = await nr.json();
                nList.innerHTML = nd.slice(0, 5).map(n => `<div class="news-item"><div style="font-size:0.7rem;color:var(--accent);margin-bottom:3px;">${n.source}</div><a href="${n.url}" target="_blank">${n.headline}</a></div>`).join('');
            } catch(e) { nList.innerHTML = '뉴스 로드 실패'; }

            // AI 리포트
            const aList = document.getElementById('ai-list');
            let aHtml = '';
            for(const s of syms.slice(0, 2)) {
                try {
                    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${s}&token=${KEY}`);[cite: 1]
                    const d = await r.json();
                    aHtml += `<div class="ai-box"><strong>${s} 분석:</strong> 현재가 $${d.c} 기준 ${d.dp > 0 ? '상승' : '조정'} 국면입니다. 기술적 지표상 ${d.dp > 0 ? '추가 매수' : '비중 조절'} 전략이 유효해 보입니다.</div><br>`;
                } catch(e) {}
            }
            aList.innerHTML = aHtml;
        }

        function addT() {
            const v = document.getElementById('t-in').value.toUpperCase().trim();
            if(v && !syms.includes(v)) {
                syms.push(v);
                localStorage.setItem('my_s_v3', JSON.stringify(syms));
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
